<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            box-sizing: border-box;
        }
        #container {
            display: flex;
            gap: 15px; 
            width: 80%;
            max-width: 900px;
            height: 400px; 
            margin: 5% auto; 
        }
        .foto {
            flex: 1; 
            height: 100%;
            border-radius: 50px; 
            overflow: hidden;
            cursor: pointer;
            transition: flex 0.5s ease; 
        }
        .foto:hover {
            flex: 4; 
        }
        .foto img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            border-radius: 50px; 
        }
        
    </style>

</head>
<body>
    
    <div id="container">
        <div class="foto"><img src="imagem/im1.png"></a></div>
        <div class="foto"><img src="imagem/im2.jpg"></a></div>
        <div class="foto"><img src="imagem/im3.jpg"></a></div>
        <div class="foto"><img src="imagem/im4.jpg"></a></div>
        <div class="foto"><img src="imagem/im5.jpg"></a></div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            margin: 0px;    
        }
        #container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr 1fr;
            height: 100vh;
            gap: 10px;
        }
        .um{
            display: grid;
            background-color: #ebeb53;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            grid-column: span 3;
            grid-row: span 1;
            border-radius: 25px;
        }
        .dois{
            display: grid;
            background-color: red;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            grid-column: span 1;
            grid-row: span 1;
            border-radius: 25px;
        }
        .tres{
            display: grid;
            background-color: #ebeb53;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            grid-column: span 1;
            grid-row: span 2;
            border-radius: 25px;
        }
        .quatro{
            display: grid;
            background-color: red;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            grid-column: span 1;
            grid-row: span 1;
            border-radius: 25px;
        }
        .cinco{
            display: grid;
            background-color: #ebeb53;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            grid-column: span 1;
            grid-row: span 2;
            border-radius: 25px;
        }
        .seis{
            display: grid;
            background-color: red;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            grid-column: span 1;
            grid-row: span 1;   
            border-radius: 25px;
        }
        .sete{
            display: grid;
            background-color: #ebeb53;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            grid-column: span 2;
            grid-row: span 1;
            border-radius: 25px;
        }

    </style>
</head>
<body>
    
    <div id="container">
        <div class="um">1</div>
        <div class="dois">2</div>
        <div class="tres">3</div>
        <div class="quatro">4</div>
        <div class="cinco">5</div>
        <div class="seis">6</div>
        <div class="sete">7</div>
    </div>

</body>
</html>

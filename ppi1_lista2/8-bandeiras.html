<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
    .bandeira {
        width: 200px;
        height: 130px;
        border: 2px solid #333;
        position: relative;
        overflow: hidden; 
        margin-bottom: 20px;
    }

    #japao.bandeira {
        background-color: white;
    }
    #japao.bandeira > .circulo {
        width: 50px;
        height: 50px;
        background-color: red;
        border-radius: 50%; 
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    #alemanha.bandeira > .faixa1 { 
        width: 100%; 
        height: 33.33%; 
        background-color: black; 
    }
    #alemanha.bandeira > .faixa2 { 
        width: 100%; 
        height: 33.33%; 
        background-color: red; 
    }
    #alemanha.bandeira > .faixa3 { 
        width: 100%; 
        height: 33.33%; 
        background-color: gold; 
    }

    #holanda.bandeira > .faixa1 { 
        width: 100%; 
        height: 33.33%; 
        background-color: #ae1c28; 
    }
    #holanda.bandeira > .faixa2 { 
        width: 100%; 
        height: 33.33%; 
        background-color: white; 
    }
    #holanda.bandeira > .faixa3 { 
        width: 100%; 
        height: 33.33%; 
        background-color: #21468b; 
    }

    #italia.bandeira {
        display: flex; 
    }
    #italia.bandeira > .faixa1 { 
        width: 33.33%; 
        height: 100%; 
        background-color: #009246; 
    }
    #italia.bandeira > .faixa2 { 
        width: 33.33%; 
        height: 100%; 
        background-color: white; 
    }
    #italia.bandeira > .faixa3 { 
        width: 33.33%; 
        height: 100%; 
        background-color: #ce2b37; 
    }

    #brasil.bandeira {
        background-color: #009c3b;
    }
    #brasil.bandeira > .losango {
        width: 85px;
        height: 85px;
        background-color: #ffdf00;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(45deg);
    }
    #brasil.bandeira > .circulo {
        width: 50px;
        height: 50px;
        background-color: #002776;
        border-radius: 50%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }
    </style>

</head>
<body>

    <a href="#japao">Bandeira Japão</a>
    <a href="#alemanha">Bandeira Alemanha</a>
    <a href="#holanda">Bandeira Holanda</a>
    <a href="#italia">Bandeira Itália</a>
    <a href="#brasil">Bandeira Brasil</a>

    <br><br><br>
    
    <div class="bandeira" id="japao">
        <div class="circulo"></div>
    </div>

    <div class="bandeira" id="alemanha">
        <div class="faixa1"></div>
        <div class="faixa2"></div>
        <div class="faixa3"></div>
    </div>

    <div class="bandeira" id="holanda">
        <div class="faixa1"></div>
        <div class="faixa2"></div>
        <div class="faixa3"></div>
    </div>

    <div class="bandeira" id="italia">
        <div class="faixa1"></div>
        <div class="faixa2"></div>
        <div class="faixa3"></div>
    </div>

    <div class="bandeira" id="brasil">
        <div class="losango"></div>
        <div class="circulo"></div>
    </div>

</body>
</html>

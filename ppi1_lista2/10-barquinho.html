<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0; 
        }
        .container{
            position: relative;
            height: 599px;
            width: 100%;
        }
        #nuvem{
            position: absolute;
            background-color: hsl(0, 0%, 97%);
            z-index: 2;
            top: 100px;
            height: 40px;
            width: 120px;
            animation: nuvem 20s linear infinite;
            border-radius: 50%;
            box-shadow: 40px -15px 0 10px #ffffff, 80px 0px 0 0px #ffffff;
        }
        #fundo{
            position: absolute;
            top: 0px;
            background-color: #69b8b8;
            height: 400px;
            width: 100%;
            z-index: 1;
        }
        #barco {
            position: absolute;
            width: 150px;
            height: 150px;
            top: 290px;
            z-index: 4;
            animation: horizontal 15s linear infinite; 
        }
        .balanco {
            width: 100%;
            height: 100%;
            background-image: url('barco.png');
            background-size: contain;
            background-repeat: no-repeat;
            animation: balanco 1.2s ease-in-out infinite alternate; 
            transform-origin: bottom center;
        }
        #mar{
            position: absolute;
            height: 200px;
            width: 100%;
            bottom: 0px;
            z-index: 3;
            background-color: #1139a8;
            left: 0; 
            right: 0;
        }
        #mar::before, #mar::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 12px;
            background-color: #1a4cd6; 
            top: 0;
        }
        #mar::after {
            top: 18px;
            opacity: 0.6;
        }
        @keyframes balanco {
            0%{
                transform: rotate(8deg);
            }
            100%{
                transform: rotate(-8deg);
            }
        }
        @keyframes horizontal {
            0%{
                transform: translateX(-125px);
            }
            100%{
                transform: translateX(100vw);
            }
        }
        @keyframes nuvem {
            0%{
                transform: translate(-200px);
            }
            100%{
                transform: translate(100vw);
            }
        }
    </style>

</head>
<body>
    
    <div class="container">
        <div id="nuvem"></div>

        <div id="fundo"></div>

        <div id="barco">
            <div class="balanco"></div>
        </div>

        <div id="mar"></div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    p {
        height: 100px;
        line-height: 100px;
        text-align: center;
        margin: 0;
        color: white;
    }

    .bloco1 {
        background-color: plum;
    }

    .bloco2 {
        background-color: green;
    }

    .bloco3 {
        background-color: coral;
    }

    .bloco4 {
        background-color: black;
    }
    </style>
</head>
<body>
    
    <p class="bloco1">1</p>
    <p class="bloco2">2</p>
    <p class="bloco3">3</p>
    <p class="bloco4">4</p>

    <!-- Por padrão, a tag <p> é um elemento do tipo block (display: block). Elementos em bloco ocupam 100% da largura disponível na tela e forçam uma quebra de linha, fazendo com que cada elemento fique empilhado um abaixo do outro. -->

</body>
</html>

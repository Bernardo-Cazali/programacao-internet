<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    p {
        height: 100px;
        width: 25%;
        line-height: 100px;
        text-align: center;
        margin: 0;
        color: white;
        float: left;
    }

    .bloco1 {
        background-color: plum;
    }

    .bloco2 {
        background-color: green;
    }

    .bloco3 {
        background-color: coral;
    }

    .bloco4 {
        background-color: black;
    }
    </style>
</head>
<body>
    
    <p class="bloco1">1</p>
    <p class="bloco2">2</p>
    <p class="bloco3">3</p>
    <p class="bloco4">4</p>

    <!--Para alinhar os elementos lado a lado preenchendo a tela, alteramos o fluxo padrão de bloco usando float: left; (ou display: inline-block;) acompanhado de uma largura relativa de width: 25%. Isso faz com que cada um dos 4 blocos ocupe exatamente um quarto da largura total do navegador.-->

</body>
</html>
